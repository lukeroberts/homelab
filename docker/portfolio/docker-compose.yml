# Required Sure secrets must be configured in Portainer before merging this file.
# The existing portfolio stack automatically follows the repository default branch.
x-sure-env: &sure_env
  SELF_HOSTED: "true"
  SECRET_KEY_BASE: ${SURE_SECRET_KEY_BASE:?Set SURE_SECRET_KEY_BASE in Portainer}
  # All three explicit keys are required for model-level encryption to activate.
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${SURE_ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY:?Set the Sure encryption primary key in Portainer}
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${SURE_ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY:?Set the Sure deterministic encryption key in Portainer}
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${SURE_ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT:?Set the Sure encryption salt in Portainer}
  # Legacy plaintext reads are allowed only in the offline migration process.
  ACTIVE_RECORD_ENCRYPTION_SUPPORT_UNENCRYPTED_DATA: "false"
  POSTGRES_USER: sure
  POSTGRES_PASSWORD: ${SURE_POSTGRES_PASSWORD:?Set SURE_POSTGRES_PASSWORD in Portainer}
  POSTGRES_DB: sure_production
  DB_HOST: sure-db
  DB_PORT: "5432"
  REDIS_URL: redis://sure-redis:6379/1
  RAILS_ASSUME_SSL: "true"
  # HTTPS is terminated by the reverse proxy; the backend health check uses HTTP.
  RAILS_FORCE_SSL: "false"
  # No cloud AI provider or static MCP token is enabled by this deployment.
  OPENAI_ACCESS_TOKEN: ""
  # Optional Authentik OIDC; credentials and instance URLs live in Portainer.
  # Preserve the separate local super-admin login and allow new SSO identities.
  AUTH_LOCAL_LOGIN_ENABLED: "true"
  AUTH_JIT_MODE: create_and_link
  OIDC_ISSUER: ${SURE_OIDC_ISSUER:-}
  OIDC_CLIENT_ID: ${SURE_OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${SURE_OIDC_CLIENT_SECRET:-}
  OIDC_REDIRECT_URI: ${SURE_OIDC_REDIRECT_URI:-}
  OIDC_BUTTON_LABEL: Sign in with Authentik
  OIDC_BUTTON_ICON: shield

services:
  sure:
    image: sure-mcp:0.7.5-hotfix.2-8858b8ff8fef
    pull_policy: never
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    environment: *sure_env
    volumes:
      - sure-storage:/rails/storage
    depends_on:
      sure-db:
        condition: service_healthy
      sure-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/up"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - frontend
      - sure-backend

  sure-worker:
    image: sure-mcp:0.7.5-hotfix.2-8858b8ff8fef
    pull_policy: never
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    command: ["bundle", "exec", "sidekiq"]
    environment: *sure_env
    volumes:
      - sure-storage:/rails/storage
    # The web entrypoint runs db:prepare. Wait for it before starting Sidekiq.
    depends_on:
      sure:
        condition: service_healthy
      sure-db:
        condition: service_healthy
      sure-redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sure-backend

  sure-db:
    image: postgres:16.13-alpine
    environment:
      POSTGRES_USER: sure
      POSTGRES_PASSWORD: ${SURE_POSTGRES_PASSWORD:?Set SURE_POSTGRES_PASSWORD in Portainer}
      POSTGRES_DB: sure_production
    volumes:
      - sure-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - sure-backend

  sure-redis:
    image: redis:8.2.10-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - sure-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "[ \"$$(redis-cli ping)\" = PONG ]"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - sure-backend

networks:
  sure-backend:
    driver: bridge
  frontend:
    external: true

volumes:
  sure-storage:
    name: sure-storage
  sure-postgres-data:
    name: sure-postgres-data
  sure-redis-data:
    name: sure-redis-data
  actual-data:
    name: actual-data
  wealthfolio-data:
    name: wealthfolio-data
