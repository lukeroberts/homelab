# Required Sure secrets must be configured in Portainer before merging this file.
# The existing portfolio stack automatically follows the repository default branch.
x-sure-env: &sure_env
  SELF_HOSTED: "true"
  SECRET_KEY_BASE: ${SURE_SECRET_KEY_BASE:?Set SURE_SECRET_KEY_BASE in Portainer}
  POSTGRES_USER: sure
  POSTGRES_PASSWORD: ${SURE_POSTGRES_PASSWORD:?Set SURE_POSTGRES_PASSWORD in Portainer}
  POSTGRES_DB: sure_production
  DB_HOST: sure-db
  DB_PORT: "5432"
  REDIS_URL: redis://sure-redis:6379/1
  RAILS_ASSUME_SSL: "true"
  # HTTPS is terminated by the reverse proxy; the backend health check uses HTTP.
  RAILS_FORCE_SSL: "false"
  # No cloud AI provider or static MCP token is enabled by this deployment.
  OPENAI_ACCESS_TOKEN: ""

services:
  sure:
    image: ghcr.io/we-promise/sure:0.7.5-hotfix.2
    environment: *sure_env
    volumes:
      - sure-storage:/rails/storage
    depends_on:
      sure-db:
        condition: service_healthy
      sure-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/up"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    restart: unless-stopped
    networks:
      - frontend
      - sure-backend

  sure-worker:
    image: ghcr.io/we-promise/sure:0.7.5-hotfix.2
    command: ["bundle", "exec", "sidekiq"]
    environment: *sure_env
    volumes:
      - sure-storage:/rails/storage
    # The web entrypoint runs db:prepare. Wait for it before starting Sidekiq.
    depends_on:
      sure:
        condition: service_healthy
      sure-db:
        condition: service_healthy
      sure-redis:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    restart: unless-stopped
    networks:
      - sure-backend

  sure-db:
    image: postgres:16.13-alpine
    environment:
      POSTGRES_USER: sure
      POSTGRES_PASSWORD: ${SURE_POSTGRES_PASSWORD:?Set SURE_POSTGRES_PASSWORD in Portainer}
      POSTGRES_DB: sure_production
    volumes:
      - sure-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    restart: unless-stopped
    networks:
      - sure-backend

  sure-redis:
    image: redis:8.2.10-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - sure-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "[ \"$$(redis-cli ping)\" = PONG ]"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    restart: unless-stopped
    networks:
      - sure-backend

  actualbudget:
    image: ghcr.io/actualbudget/actual:26.10.0
    #ports:
    #  - '5006:5006'
    volumes:
      # Change './actual-data' below to the path to the folder you want Actual to store its data in on your server.
      # '/data' is the path Actual will look for its files in by default, so leave that as-is.
      - actual-data:/data
    healthcheck:
      # Enable health check for the instance
      test: ['CMD-SHELL', 'node src/scripts/health-check.js']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - frontend
  wealthfolio:
    image: afadil/wealthfolio:3.10.0
    #ports:
    #  - '8088:8088'
    volumes:
      - wealthfolio-data:/data
    environment:
      - WF_DB_PATH=/data/wealthfolio.db
      - WF_SECRET_KEY=${WF_SECRET_KEY}
      - WF_AUTH_PASSWORD_HASH=${WF_AUTH_PASSWORD_HASH}
      - WF_CORS_ALLOW_ORIGINS="${WF_CORS_ALLOW_ORIGINS}"
      # ── AI Agent Access / MCP (optional) ────────────────────────────────
      # Requires Wealthfolio authentication via password or OIDC.
      - WF_MCP_ENABLED=${WF_MCP_ENABLED:-false}
      - WF_MCP_AUDIT_ENABLED=${WF_MCP_AUDIT_ENABLED:-true}
    restart: unless-stopped
    networks:
      - frontend

networks:
  sure-backend:
    driver: bridge
  frontend:
    external: true

volumes:
  sure-storage:
  sure-postgres-data:
  sure-redis-data:
  actual-data:
    name: actual-data
  wealthfolio-data:
    name: wealthfolio-data
