services:
  checkmk:
    image: checkmk/check-mk-ultimate:2.5.0p19
    container_name: checkmk
    # Install startup hooks inside the container so Portainer does not
    # need a repository-relative bind mount. Keep the vendor startup as PID 1.
    entrypoint:
      - /bin/bash
      - -ec
      - |
        mkdir -p /docker-entrypoint.d/pre-start /docker-entrypoint.d/post-start
        printf '%s\n' \
          '#!/bin/sh' \
          'set -eu' \
          'omd config "$$CMK_SITE_ID" set APACHE_FORWARDED_HEADERS manual' \
          > /docker-entrypoint.d/pre-start/10-forwarded-headers.sh
        chmod 0755 /docker-entrypoint.d/pre-start/10-forwarded-headers.sh
        printf '%s\n' \
          '#!/bin/sh' \
          'set -eu' \
          'omd update-apache-config "$$CMK_SITE_ID"' \
          'apache2ctl configtest' \
          'service apache2 start' \
          > /docker-entrypoint.d/post-start/10-system-apache.sh
        chmod 0755 /docker-entrypoint.d/post-start/10-system-apache.sh
        exec /docker-entrypoint.sh "$$@"
      - checkmk-entrypoint
    ports:
      - "8010:8000"
    #  - "5000:5000"
      - "162:162/udp"
    environment:
      - TZ=America/Chicago
      - CMK_PASSWORD=${CMK_PASSWORD:?no password set}
      - CMK_SITE_ID=${CMK_SITE_ID:-cmk}
    tmpfs:
      - /opt/omd/sites/cmk/tmp:uid=1000,gid=1000
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - checkmk_data:/omd/sites:rw
    # The image's default healthcheck covers the site, not system Apache.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          omd status >/dev/null &&
          curl --noproxy '*' --fail --silent --show-error --max-time 3
          -H 'Host: localhost' -H 'X-Forwarded-Proto: https'
          http://127.0.0.1:80/.well-known/oauth-authorization-server/oauth-$$CMK_SITE_ID |
          python3 -c 'import json,sys; d=json.load(sys.stdin); issuer="https://localhost/oauth-"+sys.argv[1]; assert d["issuer"]==issuer; assert all(d[k]==issuer+"/"+p for k,p in (("authorization_endpoint","authorize"),("token_endpoint","token"),("registration_endpoint","register")))'
          "$$CMK_SITE_ID" &&
          curl --noproxy '*' --fail --silent --show-error --max-time 3
          -H 'Host: localhost' -H 'X-Forwarded-Proto: https'
          http://127.0.0.1:80/.well-known/oauth-protected-resource/$$CMK_SITE_ID/check_mk/mcp |
          python3 -c 'import json,sys; d=json.load(sys.stdin); site=sys.argv[1]; assert d["resource"]=="https://localhost/"+site+"/check_mk/mcp"; assert d["authorization_servers"]==["https://localhost/oauth-"+site]'
          "$$CMK_SITE_ID"
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
    restart: unless-stopped
    networks:
      - frontend

volumes:
  checkmk_data:
    driver: local

networks:
  frontend:
    external: true
