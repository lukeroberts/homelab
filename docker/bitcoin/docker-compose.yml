services:
  electrs:
    image: getumbrel/electrs:v0.11.1
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - ELECTRS_ELECTRUM_RPC_ADDR=0.0.0.0:50001
      - ELECTRS_DB_DIR=/data/db
      - ELECTRS_DAEMON_RPC_ADDR=${BITCOIND_RPC_ADDR}:8332
      - ELECTRS_DAEMON_P2P_ADDR=${BITCOIND_RPC_ADDR}:8333
    ports:
      - 50001:50001
    volumes:
      - electrs_data:/data
    networks:
      - frontend

networks:
  frontend:
    external: true

volumes:
  electrs_data:
    name: electrs_data
    driver: local